name: Rotate Profile Theme

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

# Give the workflow only the permission it needs.
permissions:
  contents: write

# Prevent overlapping runs.
concurrency:
  group: profile-theme-rotation
  cancel-in-progress: false

jobs:
  rotate:
    name: Rotate profile theme
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rotate theme
        run: bash scripts/rotate-theme.sh
        
